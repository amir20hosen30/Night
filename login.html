<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#aeb6c4"><title>nightcomic — ورود</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/style.css">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#202020,#080808 55%)}
.auth-card{width:min(430px,100%);background:rgba(20,20,20,.94);border:1px solid #303030;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008}
.auth-logo{text-align:center;font-size:34px;font-weight:900;margin-bottom:8px}.auth-logo span{color:#c5ccd6}.auth-sub{text-align:center;color:#aaa;margin-bottom:25px}.auth-tabs{display:flex;gap:8px;margin-bottom:18px}.auth-tabs button{flex:1;padding:11px;border:1px solid #333;background:#151515;color:#aaa;border-radius:11px;cursor:pointer}.auth-tabs button.active{background:#c5ccd6;color:#fff;border-color:#c5ccd6}.auth-form{display:grid;gap:12px}.auth-form input{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;border:1px solid #333;background:#0d0d0d;color:#fff;outline:none}.auth-form input:focus{border-color:#c5ccd6}.auth-form button{padding:13px;border:0;border-radius:11px;background:#c5ccd6;color:#fff;font-weight:700;cursor:pointer}.auth-msg{min-height:24px;color:#c5ccd6;text-align:center;margin:10px 0 0}.auth-hint{font-size:12px;color:#777;text-align:center;margin-top:14px;line-height:1.8}
</style>
</head>
<body>
<main class="auth-page"><section class="auth-card">
<div class="auth-logo">nightcomic</div><div class="auth-sub">برای ورود به سایت، ابتدا حساب بساز یا وارد حساب خودت شو.</div>
<div class="auth-tabs"><button id="loginTab" class="active" onclick="mode('login')">ورود</button><button id="registerTab" onclick="mode('register')">ثبت‌نام</button></div>
<form class="auth-form" onsubmit="submitAuth(event)"><input id="username" required minlength="3" autocomplete="username" placeholder="نام کاربری"><input id="password" required minlength="6" autocomplete="current-password" type="password" placeholder="رمز عبور"><button id="submitBtn">ورود به nightcomic</button></form>
<div id="msg" class="auth-msg"></div><div class="auth-hint">رمز عبور باید حداقل ۶ کاراکتر باشد.</div>
</section></main>
<script>
let current='login';
function mode(m){current=m;document.querySelector('#loginTab').classList.toggle('active',m==='login');document.querySelector('#registerTab').classList.toggle('active',m==='register');document.querySelector('#submitBtn').textContent=m==='login'?'ورود به nightcomic':'ساخت حساب و ورود';document.querySelector('#password').autocomplete=m==='login'?'current-password':'new-password';document.querySelector('#msg').textContent=''}
async function submitAuth(e){e.preventDefault();const msg=document.querySelector('#msg');msg.textContent='در حال پردازش...';try{const r=await fetch('/api/'+(current==='login'?'login':'register'),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value.trim(),password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');const next=new URLSearchParams(location.search).get('next');location.href=(next&&next.startsWith('/')&&!next.startsWith('//'))?next:'/profile'}catch(x){msg.textContent=x.message}}
</script>
</body></html>
