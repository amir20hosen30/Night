<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#aeb6c4">
<title>nightcomic — مطالعه</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/reader.css">
</head>
<body class="reader-body">
<header class="reader-top">
  <a id="readerBack" href="/" class="reader-btn">✕</a>
  <div class="reader-title" id="readerTitle">در حال بارگذاری…</div>
</header>

<main class="reader-main">
  <div class="reader-tools">
    <button id="zoomOut">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn">+</button>
    <button id="zoomReset">بازنشانی</button>
    <button id="fitWidth">عرض صفحه</button>
  </div>
  <div id="readerPages" class="reader-pages">
    <div class="reader-loading">در حال آماده‌سازی صفحات…</div>
  </div>
  <div class="chapter-navigation">
    <button id="prevChapter" class="nav-chapter">‹ فصل قبلی</button>
    <a id="chapterList" class="nav-chapter secondary">فهرست فصل‌ها</a>
    <button id="nextChapter" class="nav-chapter">فصل بعدی ›</button>
  </div>
</main>

<script src="/js/reader.js"></script>
</body>
</html>
